---
- name: Asegurar que firewalld está instalado
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Asegurar que firewalld está activo
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
- name: Abrir puertos necesarios
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_allowed_ports }}"
